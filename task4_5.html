<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №2 - Завдання 4-5</title>
</head>
<body>
    <h1>Завдання 4-5. Масив об'єктів (Предметна область: Судноплавство -> Порт)</h1>
    <script>
        const ports = [
            {
                name: "Одеський морський порт",
                country: "Україна",
                pricePerDay: 1200,
                category: "Міжнародний"
            },
            {
                name: "Порт Роттердам",
                country: "Нідерланди",
                pricePerDay: 3500,
                category: "Глобальний хаб"
            },
            {
                name: "Порт Гамбург",
                country: "Німеччина",
                pricePerDay: 3100,
                category: "Крупний вузловий"
            }
        ];

        console.log(" Список портів (сутності) ");
        for (const port of ports) {
            console.log(`Порт: "${port.name}", Країна: ${port.country}, Ціна дня: ${port.pricePerDay}$, Категорія: ${port.category}`);
        }
    </script>
</body>
